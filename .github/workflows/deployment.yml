name: Deployment

# Releases: "Run workflow" on integration or a release branch creates a draft
# GitHub release. A release manager publishes it, which creates the tag, and the
# release event builds and ships it. Nothing is pushed from CI.
on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      version:
        description: "Override the release version number (e.g. 5.0.0a5)"
  release:
    types: [published]

# A release is never cancelled; a newer push or PR run cancels the older one.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: ${{ github.event_name == 'push' || github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  draft-release:
    name: Draft the release
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch' && github.repository == 'DIRACGrid/WebAppDIRAC'
    permissions:
      contents: write # create the draft GitHub release
    steps:
      - name: Checkout main repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Checkout the DIRAC dependency
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: DIRACGrid/DIRAC
          path: ../DIRAC
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.11"
      - name: Installing dependencies
        run: |
          python -m pip install \
              packaging \
              python-dateutil \
              pytz \
              requests \
              setuptools_scm
      - name: Choose the version
        id: version
        env:
          EVENT_REF: ${{ github.event.ref }}
          VERSION_INPUT: ${{ github.event.inputs.version }}
        run: |
          set -xeuo pipefail
          IFS=$'\n\t'
          if [[ ! "${EVENT_REF}" =~ ^refs/heads/(integration|rel-v([5-9]|[1-9][0-9]+)r[0-9]+)$ ]]; then
            echo "Releases are made from integration or a release branch, not ${EVENT_REF}"
            exit 2
          fi
          NEW_VERSION="v${VERSION_INPUT}"
          if [[ "${NEW_VERSION}" == "v" ]]; then
            # If version wasn't given as an input to the workflow, use setuptools_scm to guess while removing "dev" portion of the version number
            NEW_VERSION=v$(python -m setuptools_scm | sed 's@Guessed Version @@g' | sed -E 's@(\.dev|\+g).+@@g')
          fi
          echo "Release will be named $NEW_VERSION"
          python .github/workflows/check_release_version.py "${NEW_VERSION}" "${EVENT_REF#refs/heads/}"
          echo "new-version=$NEW_VERSION" >> "$GITHUB_OUTPUT"
      - name: Prepare release notes
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -xeuo pipefail
          IFS=$'\n\t'
          PREV_VERSION=$(git describe --tags --abbrev=0 --match '*[0-9].[0-9]*' --exclude 'v[0-9]r*' --exclude 'v[0-9][0-9]r*')
          REFERENCE_BRANCH=${GITHUB_REF#refs/heads/}
          echo "Making release notes for ${REFERENCE_BRANCH} since ${PREV_VERSION}"
          ../DIRAC/docs/diracdoctools/scripts/dirac-docs-get-release-notes.py \
              --token "${GITHUB_TOKEN}" \
              --sinceTag "${PREV_VERSION}" \
              --branches "${REFERENCE_BRANCH}" \
              --repo "${GH_REPO}" \
              > release.notes.new
          cat release.notes.new
      - name: Create the draft release
        env:
          NEW_VERSION: ${{ steps.version.outputs.new-version }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          ../DIRAC/.github/workflows/make_release.py \
            --repo="${GH_REPO}" \
            --token="${GITHUB_TOKEN}" \
            --version="${NEW_VERSION}" \
            --rev="$(git rev-parse HEAD)" \
            --release-notes-fn="release.notes.new"

  deploy-pypi:
    name: Build
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request' || github.event_name == 'release' || (github.event_name == 'push' && github.repository == 'DIRACGrid/WebAppDIRAC')
    outputs:
      create-release: ${{ steps.check-tag.outputs.create-release }}
    steps:
      - name: Checkout main repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.11"
      - name: Installing dependencies
        run: |
          python -m pip install \
              build \
              readme_renderer \
              setuptools_scm
      - name: Validate README for PyPI
        run: |
          python -m readme_renderer README.rst -o /tmp/README.html
      - name: Check the release
        id: check-tag
        env:
          REPO: ${{ github.repository }}
          EVENT_NAME: ${{ github.event_name }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          set -xeuo pipefail
          IFS=$'\n\t'
          if [[ "${REPO}" == "DIRACGrid/WebAppDIRAC" && "${EVENT_NAME}" == "release" ]]; then
            # The draft can be edited before it is published: check again where the tag ended up
            if [[ "$(git describe --exact-match --tags HEAD)" != "${RELEASE_TAG}" ]]; then
              echo "${RELEASE_TAG} is not the tag of the checked-out commit"
              exit 2
            fi
            BRANCH=$(python .github/workflows/check_release_version.py "${RELEASE_TAG}")
            git merge-base --is-ancestor HEAD "origin/${BRANCH}" || git merge-base --is-ancestor HEAD origin/integration
            echo "create-release=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Build distributions
        if: steps.check-tag.outputs.create-release == 'true'
        run: |
          python -m build
      - name: Upload Artifact
        if: steps.check-tag.outputs.create-release == 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: webappdirac-dist
          path: dist/
          retention-days: 5

  # Only this job talks to PyPI; the deployment above runs without any PyPI credential.
  publish:
    name: Publish package on PyPI
    needs: deploy-pypi
    if: needs.deploy-pypi.outputs.create-release == 'true'
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write # IMPORTANT: this permission is mandatory for trusted publishing on pypi
    steps:
      - name: Download the distribution packages
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: webappdirac-dist
          path: dist/
      # Use trusted publisher for pypi
      # https://docs.pypi.org/trusted-publishers/
      - name: Publish package on PyPI
        uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # release/v1
