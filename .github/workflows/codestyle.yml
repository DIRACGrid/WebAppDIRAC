name: Basic tests

on: [push, pull_request]

# A new push to the same PR cancels the previous run.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  pre-commit:
    name: pre-commit
    runs-on: ubuntu-latest
    if: github.event_name != 'push' || github.repository == 'DIRACGrid/WebAppDIRAC'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.11"
      - name: Install pre-commit
        run: pip install pre-commit
      - name: Run pre-commit
        run: pre-commit run --all-files --show-diff-on-failure

  pyLint:
    name: pyLint
    runs-on: ubuntu-latest
    if: github.event_name != 'push' || github.repository == 'DIRACGrid/WebAppDIRAC'

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: DIRACGrid/DIRAC
          path: .DIRAC
          ref: integration
          persist-credentials: false

      # Installs the locked lint environment from pixi.lock (DIRAC integration
      # runtime dependencies + pylint, see pixi.toml).
      - name: Prepare environment with pixi
        uses: prefix-dev/setup-pixi@9936258fee697aff89b3fed6ca1f80a382ef694e # v0.11.3
        with:
          cache: false

      # DIRAC is installed editable (no transitive dependencies: they come
      # from the pixi environment) so that `import DIRAC` resolves for pylint.
      - name: Install DIRAC
        env:
          SETUPTOOLS_SCM_PRETEND_VERSION_FOR_DIRAC: 9.1.23
        run: pixi run python -m pip install --no-deps -e .DIRAC

      - name: Run tests
        run: pixi run pylint -E src/WebAppDIRAC
