name: Basic tests

on: [push, pull_request]

# A new push to the same PR cancels the previous run; pushes to the
# protected branches are never cancelled, so every commit gets a CI result.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  pre-commit:
    name: pre-commit
    runs-on: ubuntu-latest
    if: github.event_name != 'push' || github.repository == 'DIRACGrid/WebAppDIRAC'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # keep 3.11 until Renovate updates the pinned hooks (flynt 0.77 and
      # pyupgrade v3.10.1 predate the removal of ast.Str in Python 3.12)
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.11"
      # Not pre-commit/action: it calls actions/cache by tag, which the organization policy rejects.
      - name: Install pre-commit
        run: pip install pre-commit==4.7.0
      - name: Run pre-commit
        run: pre-commit run --all-files --show-diff-on-failure --color=always
      - uses: pre-commit-ci/lite-action@062bca0919bc9d6e66755cc05074b70c77e111fc # v1.2.0
        if: always()

  pyLint:
    name: pyLint
    runs-on: ubuntu-latest
    if: github.event_name != 'push' || github.repository == 'DIRACGrid/WebAppDIRAC'

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: DIRACGrid/DIRAC
          path: .DIRAC
          ref: integration
          persist-credentials: false

      # Installs the locked lint environment from pixi.lock (DIRAC integration
      # runtime dependencies + pylint, see pixi.toml).
      - name: Prepare environment with pixi
        uses: prefix-dev/setup-pixi@9936258fee697aff89b3fed6ca1f80a382ef694e # v0.11.3

      # DIRAC (and its dirac-common subpackage, which holds DIRACCommon) is
      # installed editable (no transitive dependencies: they come from the
      # pixi environment) so that `import DIRAC` resolves for pylint.
      # --no-build-isolation: the build backends come from pixi.lock too.
      - name: Install DIRAC
        env:
          # Placeholder: the shallow checkout has no tags to derive a version
          # from, and pylint does not depend on the value.
          SETUPTOOLS_SCM_PRETEND_VERSION: 0.0.0
        run: pixi run python -m pip install --no-deps --no-build-isolation -e .DIRAC/dirac-common -e .DIRAC

      - name: Run tests
        run: pixi run pylint -E src/WebAppDIRAC
