# Pixi environment used by the CI pylint job (.github/workflows/codestyle.yml).
# The dependency set mirrors DIRAC's environment.yml on the rel-v8r0 branch
# (the DIRAC version this branch targets): conda packages plus the pip-only
# pieces (the DIRACGrid tornado forks and Authlib), plus DIRAC's build
# backend so the workflow can install the DIRAC checkout editable with
# --no-deps --no-build-isolation. Renovate keeps pixi.lock fresh.

[workspace]
channels = ["diracgrid", "conda-forge"]
platforms = ["linux-64"]
# Enforce the release-age cooldown at solve time (Renovate's lockfile
# maintenance skips minimumReleaseAge; see DIRACGrid/.github#7).
exclude-newer = "7d"

[dependencies]
python = "3.15.*"
pip = "*"
apache-libcloud = "*"
boto3 = "*"
cachetools = "*"
certifi = "*"
cmreshandler = ">1.0.0b4"
cwltool = "*"
db12 = "*"
opensearch-py = "*"
fts3 = "*"
gitpython = ">=2.1.0"
invoke = "*"
m2crypto = ">=0.50"
# matplotlib-base: the full matplotlib pulls the conda tornado, which would
# be installed next to the tornado fork from [pypi-dependencies]
matplotlib-base = "*"
numpy = "*"
pexpect = ">=4.0.1"
pillow = "*"
prompt-toolkit = ">=3,<4"
psutil = ">=4.2.0"
pyasn1 = ">0.4.1"
pyasn1-modules = "*"
python-json-logger = ">=0.1.8"
pytz = ">=2015.7"
pyyaml = "*"
recommonmark = "*"
requests = ">=2.9.1"
sqlalchemy = "*"
"stomp.py" = "*"
suds = ">=0.6"
suds-jurko-compat = "*"
xmltodict = "*"
pycurl = "*"
voms = "*"
python-gfal2 = "*"
mysqlclient = "*"
diraccfg = "*"
ldap3 = "*"
importlib_resources = "*"
typing_extensions = ">=4.3.0"
pylint = "*"
pyparsing = ">=2.0.6"
# Build backend for the editable DIRAC install
setuptools = ">=42"
setuptools-scm = ">=3.4"
wheel = "*"

[pypi-dependencies]
Authlib = ">=1.0.0.a2"
dominate = "*"
pyjwt = "*"
# Forks of tornado used by DIRAC: configurable iostream + M2Crypto SSL support
tornado = { git = "https://github.com/DIRACGrid/tornado.git", rev = "iostreamConfigurable" }
tornado-m2crypto = { git = "https://github.com/DIRACGrid/tornado_m2crypto.git" }
